name: Release Labryo LIMS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract Version & Channel from Tag
        id: vars
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          if [[ "${TAG_NAME}" == *"-beta"* ]] || [[ "${TAG_NAME}" == *"-alpha"* ]] || [[ "${TAG_NAME}" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Build Next.js Web Standalone Engine
        run: npm run build:web

      - name: Assemble Desktop Engine Package
        shell: bash
        run: |
          mkdir -p apps/desktop/engine/standalone
          # Copy standalone build
          cp -r apps/web/.next/standalone/* apps/desktop/engine/standalone/
          # Copy static and public assets
          mkdir -p apps/desktop/engine/standalone/apps/web/.next/static
          mkdir -p apps/desktop/engine/standalone/.next/static
          cp -r apps/web/.next/static/* apps/desktop/engine/standalone/apps/web/.next/static/
          cp -r apps/web/.next/static/* apps/desktop/engine/standalone/.next/static/
          if [ -d "apps/web/public" ]; then
            mkdir -p apps/desktop/engine/standalone/apps/web/public
            cp -r apps/web/public/* apps/desktop/engine/standalone/apps/web/public/
          fi
          # Copy node.exe
          cp "$(which node)" apps/desktop/engine/node.exe

      - name: Build Desktop Application with electron-builder
        run: |
          cd apps/desktop
          npx electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Generate Checksums & Formats
        id: checksums
        shell: bash
        run: |
          cd apps/desktop/dist
          SETUP_EXE=$(ls *Setup*.exe | head -n 1)
          cp "$SETUP_EXE" "Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe"
          if [ -f "${SETUP_EXE}.blockmap" ]; then
            cp "${SETUP_EXE}.blockmap" "Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe.blockmap"
          fi
          
          # Generate SHA-512 & SHA-256
          sha512sum "Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe" > SHA512SUMS.txt
          sha256sum "Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe" > SHA256SUMS.txt
          
          # Update latest.yml pointers
          sed -i "s/url: .*/url: Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe/g" latest.yml
          sed -i "s/path: .*/path: Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe/g" latest.yml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Labryo Clinical LIMS ${{ steps.vars.outputs.tag_name }}"
          draft: false
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            apps/desktop/dist/Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe
            apps/desktop/dist/Labryo.LIMS.Setup.${{ steps.vars.outputs.version }}.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/SHA512SUMS.txt
            apps/desktop/dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
